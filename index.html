
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumeysa & Safa | Hikâyemiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at center, #f8eee0 0%, #d8c3a8 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: 'Cormorant Garamond', serif;
  color: #49382e;
  overflow-x: hidden;
}

.heading {
  text-align: center;
  margin: 24px 0;
}

.heading h1 {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(2.2rem, 5vw, 3.4rem);
  font-weight: 600;
  margin: 0;
  color: #795844;
}

.heading p {
  font-size: 1.1rem;
  letter-spacing: 4px;
  margin: 5px 0 0;
  color: #92745d;
}

.book-container {
  width: min(94vw, 1050px);
  perspective: 2200px;
}

.book {
  position: relative;
  display: flex;
  width: 100%;
  aspect-ratio: 1.5 / 1;
  min-height: 480px;
  max-height: 680px;
  background: #f8f0e4;
  border-radius: 8px;
  box-shadow:
    0 25px 55px rgba(64, 42, 26, 0.3),
    0 5px 12px rgba(64, 42, 26, 0.15);
  transform-style: preserve-3d;
}

.book::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 18px;
  transform: translateX(-50%);
  background: linear-gradient(
    to right,
    rgba(65, 43, 27, 0.18),
    rgba(255,255,255,0.3),
    rgba(65, 43, 27, 0.15)
  );
  z-index: 5;
  pointer-events: none;
}

.page {
  width: 50%;
  height: 100%;
  padding: clamp(22px, 4vw, 55px);
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.5), transparent 75%),
    linear-gradient(90deg, rgba(120, 85, 55, 0.05), transparent 12%),
    #fffaf1;
  box-shadow: inset 0 0 25px rgba(120, 85, 55, 0.06);
}

.left-page {
  border-radius: 8px 0 0 8px;
  border-right: 1px solid rgba(130, 100, 70, 0.15);
}

.right-page {
  border-radius: 0 8px 8px 0;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.5), transparent 75%),
    linear-gradient(270deg, rgba(120, 85, 55, 0.05), transparent 12%),
    #fffaf1;
}

/* İsim sayfaları */

.cover-content {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.cover-hearts {
  color: #a47b62;
  font-size: 2rem;
  letter-spacing: 10px;
  margin-bottom: 35px;
}

.cover-name {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(2.5rem, 5vw, 4rem);
  color: #49382e;
}

/* Vintage hikâye sayfası */

.story-page {
  height: 100%;
  min-height: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px 20px 35px;
  border: 1px solid rgba(177, 145, 105, 0.35);
}

/* Köşe süsleri */

.story-page::before,
.story-page::after {
  content: "❧";
  position: absolute;
  color: #b99a72;
  font-size: 25px;
  opacity: 0.7;
}

.story-page::before {
  top: 4px;
  left: 7px;
}

.story-page::after {
  bottom: 4px;
  right: 7px;
  transform: rotate(180deg);
}

.corner {
  position: absolute;
  color: #b99a72;
  font-size: 22px;
  opacity: 0.65;
}

.corner.top-right {
  top: 4px;
  right: 7px;
  transform: rotate(90deg);
}

.corner.bottom-left {
  bottom: 4px;
  left: 7px;
  transform: rotate(-90deg);
}

.story-emoji {
  font-size: clamp(1.8rem, 3vw, 2.5rem);
  margin-bottom: 12px;
  filter: drop-shadow(0 2px 2px rgba(80, 50, 30, 0.12));
}

.story-title {
  font-size: clamp(1.45rem, 2.8vw, 2.2rem);
  line-height: 1.15;
  font-weight: 600;
  color: #795844;
  margin: 0 0 15px;
}

.title-divider {
  width: 65%;
  max-width: 210px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 auto 22px;
  color: #b18d67;
}

.title-divider::before,
.title-divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: linear-gradient(to right, transparent, #b18d67);
}

.title-divider::after {
  background: linear-gradient(to left, transparent, #b18d67);
}

.title-divider span {
  font-size: 13px;
}

.story-text {
  font-size: clamp(1.05rem, 1.75vw, 1.35rem);
  line-height: 1.75;
  color: #55463b;
  max-width: 95%;
  white-space: normal;
}

.story-bottom {
  margin-top: 18px;
  font-size: 1.2rem;
  color: #b18d67;
}

.page-number {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  font-size: 0.95rem;
  color: #b49a7e;
  letter-spacing: 2px;
}

/* Son sayfa */

.final-page .story-emoji {
  font-size: 2.8rem;
}

.final-page .story-title {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(2rem, 4vw, 3rem);
}

/* 3D sayfa çevirme */

.flip-page {
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  z-index: 10;
  transform-style: preserve-3d;
  transition: transform 0.85s ease-in-out;
  pointer-events: none;
}

.flip-page.forward {
  left: 50%;
  transform-origin: left center;
}

.flip-page.backward {
  left: 0;
  transform-origin: right center;
}

.flip-page.flipping-forward {
  transform: rotateY(-180deg);
}

.flip-page.flipping-backward {
  transform: rotateY(180deg);
}

.flip-front,
.flip-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  overflow: hidden;
  padding: clamp(22px, 4vw, 55px);
  background: #fffaf1;
  box-shadow: 0 0 18px rgba(50, 30, 15, 0.18);
}

.flip-front {
  border-radius: 0 8px 8px 0;
}

.flip-back {
  transform: rotateY(180deg);
  border-radius: 8px 0 0 8px;
}

/* Butonlar */

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  margin: 25px 0 15px;
}

button {
  border: 1px solid #a98b70;
  background: rgba(255, 250, 241, 0.85);
  color: #795844;
  padding: 12px 24px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2rem;
  cursor: pointer;
  border-radius: 30px;
  transition: all 0.25s ease;
}

button:hover:not(:disabled) {
  background: #795844;
  color: white;
  transform: translateY(-2px);
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.counter {
  color: #795844;
  font-size: 1.1rem;
  min-width: 90px;
  text-align: center;
}

.footer {
  font-family: 'Dancing Script', cursive;
  color: #8b6a55;
  font-size: 1.4rem;
  margin: 5px 0 25px;
  text-align: center;
}

/* Telefon görünümü */

@media (max-width: 600px) {
  .book-container {
    width: 96vw;
  }

  .book {
    min-height: 510px;
    aspect-ratio: 0.85 / 1;
  }

  .page {
    padding: 12px 9px;
  }

  .story-page {
    padding: 20px 7px 35px;
  }

  .story-title {
    font-size: 1.25rem;
    margin-bottom: 12px;
  }

  .story-text {
    font-size: 0.92rem;
    line-height: 1.55;
    max-width: 100%;
  }

  .story-emoji {
    font-size: 1.6rem;
    margin-bottom: 9px;
  }

  .title-divider {
    margin-bottom: 14px;
  }

  .story-bottom {
    margin-top: 10px;
  }

  .controls {
    gap: 10px;
  }

  button {
    padding: 10px 16px;
    font-size: 1rem;
  }

  .flip-front,
  .flip-back {
    padding: 12px 9px;
  }
}
</style>
</head>

<body>

<div class="heading">
  <h1>Bir Hikâyenin Başlangıcı</h1>
  <p>RUMEYSA & SAFA</p>
</div>

<div class="book-container">
  <div class="book" id="book">
    <div class="page left-page" id="leftPage"></div>
    <div class="page right-page" id="rightPage"></div>
  </div>
</div>

<div class="controls">
  <button id="prevBtn" onclick="previousSpread()">← Önceki</button>
  <div class="counter" id="counter"></div>
  <button id="nextBtn" onclick="nextSpread()">Sonraki →</button>
</div>

<div class="footer">Her güzel hikâye bir adımla başlar... ♡</div>

<script>

/* Teklif sayfasını açmak için false yerine true yaz */
const proposalMode = false;

/* İlk iki isim sayfası */

const coverPages = [
  { cover: true, name: "Rumeysa" },
  { cover: true, name: "Safa" }
];

/* Hikâyemiz - Her sayfanın kendine özel emojisi var */

const storyPages = [

  {
    title: "Nasıl Tanıştık?",
    emoji: "♡",
    text: "Bazen hayatımıza kimin gireceğini, nerede ve nasıl tanışacağımızı hiç bilemeyiz. Bizim hikâyemiz de böyle başladı. Birbirimizi tanımak için atılan küçük bir adım, zamanla güzel bir hikâyenin başlangıcına dönüştü."
  },

  {
    title: "İlk Mesajlarımız",
    emoji: "💌",
    text: "Birbirimizi daha yakından tanımak için mesajlaşmaya başladık. Günlük hayatımızdan, düşüncelerimizden ve merak ettiklerimizden konuşmaya başladık. Her mesaj, birbirimizi biraz daha tanımamıza vesile oldu."
  },

  {
    title: "İlk Görüntülü Konuşmamız",
    emoji: "📱",
    text: "İlk kez görüntülü konuştuğumuzda genel sorularla birbirimizi tanımaya çalıştık. Biraz heyecan, biraz merak... Ama en önemlisi, sohbetin doğal bir şekilde ilerlemesiydi."
  },

  {
    title: "İkinci Görüntülü Konuşmamız",
    emoji: "✨",
    text: "Bu kez konuşmamız biraz daha farklıydı. Daha ciddi konulara, geleceğe ve evlilikle ilgili düşüncelerimize değindik. Rumeysa'nın Amerika'ya taşınmayı kabul etmesi 🥳, hikâyemizde yeni bir sayfanın açılmasına vesile oldu."
  },

  {
    title: "Küçük Bir Hal Hatır",
    emoji: "🌷",
    text: "Ertesi gün yine birbirimize yazdık. Büyük konular konuşmadan, sadece günümüzün nasıl geçtiğini sorduk. Bazen küçük bir mesaj bile insanın yüzünde güzel bir gülümseme oluşturabiliyor."
  },

  {
    title: "Büyük Gün Belirlendi!",
    emoji: "🗓️",
    text: "Üçüncü görüntülü konuşmamızda artık yüz yüze tanışmaya karar verdik. Hafta sonu buluşacaktık. Artık birbirimizi sadece ekranın arkasından değil, gerçek hayatta da tanıma zamanı gelmişti."
  },

  {
    title: "Küçük Detaylar",
    emoji: "🌸",
    text: "Buluşmadan önceki günlerde yemeklerden, sevdiğimiz şeylerden ve küçük tercihlerimizden konuştuk. Birbirimizi tanımanın en güzel tarafı, bu küçük detayları da öğrenmekti."
  },

  {
    title: "Büyük Buluşmadan Bir Gün Önce",
    emoji: "🚗",
    text: "Heyecan giderek artıyordu. Safa, Rumeysa'yla buluşmak için Amerika'dan Kanada'ya doğru yola çıktı. İkimiz de ertesi günün nasıl geçeceğini merak ediyor, güzel bir buluşma olmasını umuyorduk."
  },

  {
    title: "İlk Yüz Yüze Buluşmamız",
    emoji: "❤️",
    text: "Sonunda beklenen gün geldi. Birlikte yaklaşık 9 saat geçirdik ve tam 15.000 adım yürüdük! Güzel sohbetler ettik, keyifli vakit geçirdik ve birbirimizi daha yakından tanıdık. İkimiz de buluşmadan güzel duygularla ayrılmıştık. Ancak sonrasında yaşanan küçük bir iletişim eksikliği, aramızda ufak bir yanlış anlaşılmaya neden oldu."
  },

  {
    title: "İkinci Yüz Yüze Buluşmamız",
    emoji: "🫶",
    text: "İkinci kez bir araya geldiğimizde bu kez yanlış anlaşılmayı açıklığa kavuşturduk. Yaklaşık 4 saat boyunca konuştuk. Birbirimizi daha iyi anladık. Ayrılma vakti geldiğinde ikimiz için de biraz hüzünlüydü ama yeniden görüşme niyetiyle vedalaştık. ❤️"
  },

  {
    title: "Safa'nın Eve Dönüş Yolculuğu",
    emoji: "🛣️",
    text: "Safa, Kanada'dan Amerika'ya doğru yola çıktı. Rumeysa ise babasıyla ve abisiyle Safa hakkında konuşacaktı. Yol boyunca Safa'nın aklında tek bir şey vardı: Acaba nasıl geçmişti? Güzel bir haber almayı umut ederek eve doğru ilerledi."
  },

  {
    title: "Aileyle İlk Paylaşım",
    emoji: "🏡",
    text: "Rumeysa, babasına ve abisine Safa'dan bahsetti. Onlar için beklenmedik bir haberdi ama onu tanımaya açık olduklarını söylediler. Rumeysa heyecanla Safa'yı arayıp olanları anlattı. Bu haber ikisi için de yeni ve güzel bir adımdı."
  },

  {
    title: "Saatler Yetmiyor...",
    emoji: "⏳",
    text: "Gün içinde saatlerce konuşsak bile sanki hiç yetmiyor. Bazen anlatacaklarımız bitmiyor, bazen de sadece konuşuyor olmak bile güzel geliyor. Birbirimizi tanıdıkça sohbetlerimiz de daha anlamlı hale geliyor."
  },

  {
    title: "Bir Hafta, Bir Ay Gibi",
    emoji: "🌙",
    text: "Aslında henüz bir haftadır konuşuyoruz. Ama bazen öyle geliyor ki sanki bir aydır birbirimizi tanıyoruz. Zamanın nasıl geçtiğini anlamadan, her gün yeni bir şey öğrenerek ilerliyoruz."
  },

  {
    title: "Devam Edecek...",
    emoji: "♾️",
    text: "Bu hikâyenin daha anlatılacak çok sayfası var. Önümüzde bizi nelerin beklediğini henüz bilmiyoruz. Ama güzel niyetlerle, sabırla ve birbirimizi daha iyi tanıyarak ilerlemeye devam ediyoruz.\n\nBakalım bir sonraki sayfada bizi neler bekliyor... ♡"
  }

];

/* İleride kullanılabilecek teklif sayfası */

const proposalPage = {
  title: "Benimle Evlenir Misin?",
  emoji: "💍",
  text: "Birlikte başladığımız bu güzel hikâyenin geri kalanını da seninle yazmak istiyorum.\n\nHayatın tüm güzel ve zor günlerinde yanında olmak, birlikte gülmek, birlikte büyümek ve bir ömür aynı yolda yürümek istiyorum.",
  question: "Benimle evlenir misin, Rumeysa? ❤️"
};

const pages = proposalMode
  ? [...coverPages, ...storyPages.slice(0, -1), proposalPage]
  : [...coverPages, ...storyPages];

let spread = 0;
let isAnimating = false;

const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");
const counter = document.getElementById("counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const book = document.getElementById("book");

const totalSpreads = Math.ceil(pages.length / 2);

/* Sayfa HTML'i */

function makePage(data, number) {

  if (!data) {
    return `<div class="page-number">♡</div>`;
  }

  /* İlk iki isim sayfası */
  if (data.cover) {
    return `
      <div class="cover-content">
        <div class="cover-hearts">♥ ♥ ♥</div>
        <div class="cover-name">${data.name}</div>
      </div>
    `;
  }

  const safeText = data.text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\n/g, "<br>");

  const isFinal = data.title === "Devam Edecek...";

  return `
    <div class="story-page ${isFinal ? "final-page" : ""}">

      <span class="corner top-right">❧</span>
      <span class="corner bottom-left">❧</span>

      <div class="story-emoji">${data.emoji || "♡"}</div>

      <h2 class="story-title">${data.title}</h2>

      <div class="title-divider">
        <span>✦</span>
      </div>

      <div class="story-text">${safeText}</div>

      ${data.question ? `
        <div class="question">${data.question}</div>
      ` : ""}

      <div class="story-bottom">❦</div>

      <div class="page-number">
        — ${String(number).padStart(2, "0")} —
      </div>

    </div>
  `;
}

/* Kitabı göster */

function render() {
  const leftIndex = spread * 2;
  const rightIndex = leftIndex + 1;

  leftPage.innerHTML = makePage(pages[leftIndex], leftIndex + 1);
  rightPage.innerHTML = makePage(pages[rightIndex], rightIndex + 1);

  counter.textContent = `${spread + 1} / ${totalSpreads}`;

  prevBtn.disabled = spread === 0 || isAnimating;
  nextBtn.disabled = spread >= totalSpreads - 1 || isAnimating;
}

/* İleri sayfa */

function nextSpread() {

  if (spread >= totalSpreads - 1 || isAnimating) return;

  isAnimating = true;
  render();

  const nextLeft = pages[(spread + 1) * 2];
  const nextRight = pages[(spread + 1) * 2 + 1];

  const flip = document.createElement("div");
  flip.className = "flip-page forward";

  flip.innerHTML = `
    <div class="flip-front">
      ${makePage(pages[spread * 2 + 1], spread * 2 + 2)}
    </div>
    <div class="flip-back">
      ${makePage(nextLeft, (spread + 1) * 2 + 1)}
    </div>
  `;

  book.appendChild(flip);

  rightPage.innerHTML = makePage(nextRight, (spread + 1) * 2 + 2);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      flip.classList.add("flipping-forward");
    });
  });

  setTimeout(() => {
    spread++;
    flip.remove();
    isAnimating = false;
    render();
  }, 850);
}

/* Geri sayfa */

function previousSpread() {

  if (spread <= 0 || isAnimating) return;

  isAnimating = true;
  render();

  const previousLeft = pages[(spread - 1) * 2];
  const previousRight = pages[(spread - 1) * 2 + 1];

  const flip = document.createElement("div");
  flip.className = "flip-page backward";

  flip.innerHTML = `
    <div class="flip-front">
      ${makePage(pages[spread * 2], spread * 2 + 1)}
    </div>
    <div class="flip-back">
      ${makePage(previousRight, (spread - 1) * 2 + 2)}
    </div>
  `;

  book.appendChild(flip);

  leftPage.innerHTML = makePage(previousLeft, (spread - 1) * 2 + 1);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      flip.classList.add("flipping-backward");
    });
  });

  setTimeout(() => {
    spread--;
    flip.remove();
    isAnimating = false;
    render();
  }, 850);
}

/* Bilgisayar klavye kontrolleri */

document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") nextSpread();
  if (event.key === "ArrowLeft") previousSpread();
});

/* Telefon kaydırma kontrolleri */

let touchStartX = 0;

book.addEventListener("touchstart", (event) => {
  touchStartX = event.changedTouches[0].screenX;
}, { passive: true });

book.addEventListener("touchend", (event) => {
  const touchEndX = event.changedTouches[0].screenX;
  const difference = touchEndX - touchStartX;

  if (Math.abs(difference) > 50) {
    if (difference < 0) nextSpread();
    else previousSpread();
  }
}, { passive: true });

/* Başlangıç */

render();

</script>
</body>
</html>
